<!-- Backdrop Overlay (Fundo escuro embaçado) -->
<div x-show="detailOpen" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="detailOpen = false"
     class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60]"
     style="display: none;">
</div>

<!-- Drawer Panel (Gaveta lateral) -->
<div x-show="detailOpen" 
     x-transition:enter="transform transition ease-in-out duration-500"
     x-transition:enter-start="translate-x-full"
     x-transition:enter-end="translate-x-0"
     x-transition:leave="transform transition ease-in-out duration-500"
     x-transition:leave-start="translate-x-0"
     x-transition:leave-end="translate-x-full"
     class="fixed inset-y-0 right-0 w-full max-w-lg bg-[#0d0d0f] border-l border-white/10 z-[70] shadow-2xl flex flex-col"
     style="display: none;"
     @keydown.window.escape="detailOpen = false">
    
    <!-- Header -->
    <div class="p-6 border-b border-white/5 flex items-center justify-between bg-gradient-to-r from-indigo-600/5 to-transparent">
        <div class="flex items-center gap-4">
            <button @click="detailOpen = false" class="p-2 hover:bg-white/5 rounded-full text-gray-400 hover:text-white transition-all">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h2 class="text-xl font-bold text-white tracking-tight">Análise Detalhada</h2>
        </div>
        <div class="px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-black" x-text="candidate.score + '% Match'"></div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto p-8 space-y-8 custom-scrollbar">
        
        <!-- Perfil do Candidato -->
        <div class="flex flex-col items-center text-center">
            <div class="w-20 h-20 rounded-[2rem] bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-3xl font-black text-white mb-4 shadow-lg shadow-indigo-500/20" x-text="candidate.name ? candidate.name[0] : ''"></div>
            <h3 class="text-2xl font-bold text-white" x-text="candidate.name"></h3>
            <p class="text-gray-500 text-sm font-medium" x-text="candidate.email"></p>
            
            <div class="flex gap-2 mt-5">
                <span class="px-3 py-1 rounded-lg bg-white/5 border border-white/10 text-[10px] font-bold text-gray-400 uppercase tracking-widest" x-text="'Enviado em: ' + candidate.date"></span>
                <span class="px-3 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-[10px] font-bold text-emerald-400 uppercase tracking-widest" x-text="candidate.status"></span>
            </div>
        </div>

        <!-- Parecer da IA -->
        <div class="space-y-4">
            <div class="flex items-center gap-2 text-indigo-400">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
                <h4 class="text-xs font-black uppercase tracking-[0.2em]">Parecer do Especialista IA</h4>
            </div>
            
            <div class="relative p-6 bg-white/[0.02] border border-white/5 rounded-3xl overflow-hidden group">
                <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                <p class="text-gray-300 leading-relaxed italic text-lg font-medium" x-text="candidate.summary || 'Nenhuma análise gerada para este candidato.'"></p>
            </div>
        </div>

        <!-- Barras de Performance -->
        <div class="grid grid-cols-1 gap-4">
            <div class="p-5 bg-white/5 border border-white/5 rounded-2xl">
                <div class="flex justify-between items-end mb-2">
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Potencial Técnico (RAG Score)</p>
                    <p class="text-sm font-bold text-indigo-400" x-text="candidate.score + '%'"></p>
                </div>
                <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                    <div class="h-full bg-indigo-500 transition-all duration-1000" :style="'width: ' + candidate.score + '%'"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Actions -->
    <div class="p-6 border-t border-white/5 bg-black/40 backdrop-blur-xl grid grid-cols-1 gap-3">
       <!--  <button class="w-full flex items-center justify-center gap-2 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl transition-all active:scale-95">
            <i data-lucide="check-circle" class="w-5 h-5"></i>
            Aprovar para Próxima Etapa
        </button> -->
        <!-- <button @click="detailOpen = false" class="w-full py-4 text-gray-500 hover:text-white text-sm font-bold transition-all"> -->
            <!-- Fechar Detalhes -->
        </button>
    </div>
</div>

<style>
    /* Scrollbar minimalista para o drawer */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
</style>
