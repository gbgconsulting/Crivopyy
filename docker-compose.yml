services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crivopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crivopy}
      POSTGRES_DB: ${POSTGRES_DB:-crivopy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT_PUBLISH:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      # Host -> container: navegador em http://127.0.0.1:8000 (ou IP da máquina na LAN)
      - '0.0.0.0:${WEB_PORT:-8000}:8000'
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-crivopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crivopy}
      POSTGRES_DB: ${POSTGRES_DB:-crivopy}
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
